[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailjson"
dynamic = ["version"]
description = "Turn a Postfix mail.log into JSON records, one per message"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/yaroslaff/mailjson"
Repository = "https://github.com/yaroslaff/mailjson"

[project.scripts]
mailjson = "mailjson.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/mailjson/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mailjson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
